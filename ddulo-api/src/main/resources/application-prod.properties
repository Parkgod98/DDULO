spring.datasource.url=jdbc:mysql://mysql-container:3306/ddulo?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.data.redis.host=redis-container
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PWD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

spring.sql.init.mode=never